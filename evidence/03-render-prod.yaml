apiVersion: v1
kind: Namespace
metadata:
  annotations:
    training.example.com/change-policy: approval-required
  labels:
    environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>webapp - prod</title></head>
      <body style="background:#ffebee">
        <h1>production</h1>
        <p>Environment: production</p>
        <p>Namespace: webapp-prod</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  annotations:
    training.example.com/change-policy: approval-required
  labels:
    app.kubernetes.io/name: webapp
    environment: prod
  name: web-content-cgkcc9tt7c
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    training.example.com/change-policy: approval-required
  labels:
    app.kubernetes.io/name: webapp
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: webapp
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/change-policy: approval-required
  labels:
    app.kubernetes.io/name: webapp
    environment: prod
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      app.kubernetes.io/name: webapp
  template:
    metadata:
      annotations:
        training.example.com/change-policy: approval-required
      labels:
        app: webapp
        app.kubernetes.io/name: webapp
        environment: prod
    spec:
      containers:
      - image: nginx:1.27.3-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-cgkcc9tt7c
        name: web-content
