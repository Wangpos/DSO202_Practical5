apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: qa
  name: webapp-qa
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>webapp - qa</title></head>
      <body style="background:#e3f2fd">
        <h1>qa</h1>
        <p>Environment: quality assurance</p>
        <p>Namespace: webapp-qa</p>
        <p>Owner: qa-team</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: qa
  name: web-content-htkgc9bm2g
  namespace: webapp-qa
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: qa
  name: webapp
  namespace: webapp-qa
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: webapp
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/owner: qa-team
  labels:
    app.kubernetes.io/name: webapp
    environment: qa
  name: webapp
  namespace: webapp-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app: webapp
        app.kubernetes.io/name: webapp
        environment: qa
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-htkgc9bm2g
        name: web-content
