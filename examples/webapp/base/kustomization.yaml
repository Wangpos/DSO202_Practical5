apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Applied to every resource, including selectors, so all
# environments can be found with -l app.kubernetes.io/name=webapp
labels:
  - pairs:
      app.kubernetes.io/name: webapp
    includeSelectors: true

# index.html becomes a ConfigMap; Kustomize appends a content hash
# to its name and rewrites the reference in the Deployment volume.
configMapGenerator:
  - name: web-content
    files:
      - index.html
