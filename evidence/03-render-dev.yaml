apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: dev
  name: webapp-dev
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>webapp - dev</title></head>
      <body style="background:#e8f5e9">
        <h1>development</h1>
        <p>Environment: development</p>
        <p>Namespace: webapp-dev</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: web-content-hc85hbfh9k
  namespace: webapp-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: webapp
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app: webapp
        app.kubernetes.io/name: webapp
        environment: dev
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-hc85hbfh9k
        name: web-content
